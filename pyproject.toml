[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astraea-1"
version = "0.1.0"
description = "Decentralized Zero-Trust IDS for LEO Satellite Swarms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0.0",
    "cryptography>=41.0.0",
    "nats-py>=2.6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
astraea-node = "astraea.node.satellite_node:main"
astraea-aggregator = "federated_aggregator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["astraea*"]
