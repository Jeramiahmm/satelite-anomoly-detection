name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check
        run: |
          python -m py_compile astraea/node/satellite_node.py
          python -m py_compile astraea/messaging/isl.py
          python -m py_compile federated_aggregator.py
          python -m py_compile scripts/red_team.py

      - name: Run test suite
        run: python -m pytest tests/test_integration.py -v --tb=short

      - name: Run red-team (polarized)
        run: python -m scripts.red_team --attack polarized

      - name: Run red-team (spacejack)
        run: python -m scripts.red_team --attack spacejack

      - name: Run red-team (bitflip)
        run: python -m scripts.red_team --attack bitflip

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for CA bootstrap
        run: |
          pip install cryptography

      - name: Bootstrap CA
        run: python -m scripts.bootstrap_ca

      - name: Build Docker image
        run: docker compose build

      - name: Verify Docker Compose config
        run: docker compose config --quiet
